name: Deploy collab Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main, master]
    paths:
      - "workers/collab/**"
      - ".github/workflows/collab-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:cf
      - name: Deploy staging
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
        run: npm run deploy:collab:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy production
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
          (github.event_name == 'push')
        run: npm run deploy:collab:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
